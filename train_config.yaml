model_name_or_path: ./models/Qwen2.5-3B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
quantization_bit: 4
quantization_method: bitsandbytes

dataset: lol_sft
template: qwen
cutoff_len: 1024
preprocessing_num_workers: 8

per_device_train_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

logging_steps: 10
save_steps: 100
save_total_limit: 3
save_strategy: steps
report_to: tensorboard

bf16: false
flash_attn: fa2
optim: adamw_torch
ddp_timeout: 180000000

output_dir: ./saves/lol_qwen3b_lora
plot_loss: true
