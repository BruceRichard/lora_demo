syntax = "proto3";
package bilibili.danmaku;

message DanmakuElem {
  int64 id = 1;
  int32 progress = 2;
  int32 mode = 3;
  int32 fontsize = 4;
  uint32 color = 5;
  string midHash = 6;
  string content = 7;
  int64 ctime = 8;
  int32 weight = 9;
  string action = 10;
  int32 pool = 11;
  string idStr = 12;
  int32 attr = 13;
  string animation = 22;
  int64 mid = 25;
  int32 dm_type = 26;
  int64 dm_id = 27;
  int64 uid = 30;
  int64 show_flow_weight = 31;
  int64 show_count = 32;
  int64 dmid = 36;
}

message DmSegMobileReply {
  repeated DanmakuElem elems = 1;
  DmSegWebInfo web_info = 2;
  int32 visible_danmaku_num = 3;
}

message DmSegWebInfo {
  int32 dm_need_scan = 1;
  string scan_type = 2;
  string scan_end = 3;
}
